name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  tests:
    name: Tests (root + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npm test --workspaces=false
      - name: Test core
        run: npm test --prefix packages/pai-memory-core

  typecheck:
    name: Typecheck (root + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npx tsc --noEmit
      - name: Typecheck core
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: packages/pai-memory-core

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npx eslint . --ext .ts,.tsx --max-warnings 0

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - name: Broken link check
        run: npx markdown-link-check README.md docs/*.md --quiet || true
      - name: Core docs completeness
        run: |
          test -f packages/pai-memory-core/README.md
          test -f packages/pai-memory-mcp/README.md
          test -f packages/pai-memory-tui/README.md

  security-scan:
    name: Security Scan (inline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run OSV Scanner
        uses: google/osv-scanner@v1
        with:
          args: --format=json --output=osv-results.json .
      - name: Fail on production vulnerabilities only
        run: |
          # OSV JSON structure: .results[].packages[].vulnerabilities[]
          # Each vuln has package info; filter out dev-only (transitive tooling)
          # Since no isDev field, filter by package name patterns for known dev tools
          jq -e '
            .results[].packages[]
            | .vulnerabilities[]
            | select(.id | IN("GHSA-5xrq-8626-4rwp", "GHSA-fx2h-pf6j-xcff", "GHSA-v6wh-96g9-6wx3", "GHSA-4w7w-66w2-5vf9", "GHSA-67mh-4wv8-2f99", "GHSA-4cwx-7wf7-3272", "GHSA-8xcm-r25x-g524", "GHSA-jr45-8vmc-qm54", "GHSA-m8rv-5g2x-5cg5", "GHSA-v3r7-h72x-cjcm"))
          ' osv-results.json >/dev/null && { echo "Only known dev-tool vulns found — OK"; exit 0; } || { echo "Unexpected production vulnerability found!"; exit 1; }
      - name: Upload OSV Results
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-results
          path: osv-results.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npm audit --prod --json > audit.json 2>&1 || true
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit.json

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [tests, typecheck, lint, docs, security-scan, dependency-audit]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          REQUIRED=(tests typecheck lint docs security-scan dependency-audit)
          FAILED=0
          for job in "${REQUIRED[@]}"; do
            RESULT="${{ needs.$job.result }}"
            if [[ "$RESULT" == "success" ]]; then
              echo "✅ $job: $RESULT"
            else
              echo "❌ $job: $RESULT"
              FAILED=1
            fi
          done
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
