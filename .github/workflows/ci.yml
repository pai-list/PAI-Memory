name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (root + core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Install core package deps
        working-directory: packages/pai-memory-core
        run: npm ci
      - name: Root unit tests
        run: npx vitest run
      - name: Core unit tests
        working-directory: packages/pai-memory-core
        run: npx vitest run

  typecheck:
    name: Typecheck (root + core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Core typecheck
        working-directory: packages/pai-memory-core
        run: npx tsc --noEmit -p tsconfig.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - name: ESLint
        run: npx eslint src --ext .ts 2>&1 || echo "::warning::eslint warnings only"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core docs present
        run: |
          for f in README.md docs/PAI-MEM-SPEC.md; do
            if [ ! -f "$f" ]; then echo "::error::$f missing"; exit 1; fi
          done
      - name: Markdown lint
        run: npx markdownlint-cli2 "docs/**/*.md" "README.md" "**/*.md" "!**/node_modules/**" 2>&1 || true

  security-scan:
    name: Security Scan (inline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript
          queries: +security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:typescript"
      - name: Run OSV Scanner
        uses: google/osv-scanner@v1
        with:
          args: --format=json --output=osv-results.json .
      - name: Upload OSV Results
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-results
          path: osv-results.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install
      - run: npm audit --prod --json > audit.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json

  all-checks:
    name: All Checks Passed
    needs: [tests, typecheck, lint, docs, security-scan, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          FAILED=0
          declare -A RESULTS=(
            [tests]="${{ needs.tests.result }}"
            [typecheck]="${{ needs.typecheck.result }}"
            [lint]="${{ needs.lint.result }}"
            [docs]="${{ needs.docs.result }}"
            [security-scan]="${{ needs['security-scan'].result }}"
            [dependency-audit]="${{ needs.dependency-audit.result }}"
          )
          for job in tests typecheck lint docs security-scan dependency-audit; do
            RESULT="${RESULTS[$job]}"
            if [[ "$RESULT" == "failure" || "$RESULT" == "cancelled" ]]; then
              echo "❌ $job: $RESULT"; FAILED=1
            elif [[ "$RESULT" == "success" ]]; then
              echo "✅ $job: $RESULT"
            else
              echo "⏭️  $job: $RESULT (skipped)"
            fi
          done
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::One or more required checks failed"; exit 1
          fi
          echo "✅ All checks passed"
