name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  tests:
    name: Tests (root + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npm test --workspaces=false
      - name: Test core
        run: npm test --prefix packages/pai-memory-core

  typecheck:
    name: Typecheck (root + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npx tsc --noEmit
      - name: Typecheck core
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: packages/pai-memory-core

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npx eslint . --ext .ts,.tsx --max-warnings 0

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - name: Core docs completeness
        run: |
          test -f packages/pai-memory-core/README.md
          test -f packages/pai-memory-mcp/README.md
          test -f packages/pai-memory-tui/README.md

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci --workspaces=false --ignore-workspace-root-check
      - run: npm audit --prod --json > audit.json 2>&1 || true
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit.json

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [tests, typecheck, lint, docs, dependency-audit]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          REQUIRED=(tests typecheck lint docs dependency-audit)
          FAILED=0
          for job in "${REQUIRED[@]}"; do
            RESULT="${{ needs.$job.result }}"
            if [[ "$RESULT" == "success" ]]; then
              echo "✅ $job: $RESULT"
            else
              echo "❌ $job: $RESULT"
              FAILED=1
            fi
          done
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
